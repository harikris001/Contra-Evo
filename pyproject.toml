[project]
name = "contra-evo"
version = "0.1.0"
description = "Evolutionary Contra AI - Genetic algorithm neuroevolution for NES Contra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-retro>=1.0.0",
    "opencv-python>=4.8",
    "pygame>=2.5",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
]
benchmark = [
    "torch",  # optional MPS benchmark
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
